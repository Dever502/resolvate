[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "resolvate"
version = "4.0.0"
description = "Telegram-first customer support platform"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
authors = [{ name = "Dever502" }]
dependencies = [
  "aiogram>=3.17,<4",
  "aiohttp>=3.14.3,<4",
  "anyio>=4.14.2,<5",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pillow>=12.3,<13",
  "uvicorn[standard]>=0.34,<1",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "pypdf>=6.19.0,<7",
]

[project.scripts]
resolvate = "resolvate.__main__:main"

[tool.hatch.build]
# The Vue console build is gitignored but must ship in every wheel and sdist.
artifacts = ["src/resolvate/console_dist/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/resolvate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "postgres: requires an isolated disposable PostgreSQL test cluster",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI uses these calls as declarative endpoint metadata, not mutable defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["resolvate"]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=6,<8",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.8,<1",
]
